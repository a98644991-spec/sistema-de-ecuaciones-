<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La feria de los sistemas</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:#eef3fa;color:#1b2a41}
header{background:linear-gradient(135deg,#0b3d91,#1e88e5);color:#fff;padding:18px 12px;text-align:center}
.badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.3px}
h1{margin:10px 0 4px;font-size:26px}header p{margin:0}
nav{background:#1c2430;display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{flex:1;min-width:125px;background:none;border:0;color:#cbd5e1;padding:12px 8px;font-size:14px;font-weight:700;cursor:pointer;min-height:50px}
nav button.on{background:#1e88e5;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;background:#fff;border-bottom:1px solid #d5deea;font-size:13px}
.stats span{background:#eef3fa;border-radius:10px;padding:4px 10px}
main{max-width:900px;margin:0 auto;padding:8px 12px 30px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0002}
h2,h3,h4{margin:.4em 0}
.b{border-radius:12px;padding:10px 12px;margin:10px 0;border-left:6px solid}
.info{background:#e3f2fd;border-color:#1e88e5}.ok{background:#e6f6ea;border-color:#2e9e4f}
.hint{background:#fff8d6;border-color:#f2b800}.err{background:#fdeaea;border-color:#d94a4a}
.btn{min-height:48px;padding:10px 16px;border:0;border-radius:12px;background:#1e88e5;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.btn.or{background:#f57c00}.btn.gr{background:#e2e8f0;color:#1b2a41}.btn.on{background:#0b3d91;color:#fff}.btn:disabled{opacity:.5;cursor:default}
.opt{display:block;width:100%;text-align:left;background:#f5f8fd;border:2px solid #c5d3e6;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:17px;cursor:pointer;min-height:56px;font-family:Consolas,monospace}
.opt:disabled{opacity:.6}
.sys{font:700 18px Consolas,monospace;background:#f5f8fd;border-radius:10px;padding:8px 12px;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#f5f8fd;border-radius:10px;padding:6px 10px;margin:6px 0}
.mini{width:44px;height:44px;border:0;border-radius:10px;background:#1e88e5;color:#fff;font-size:16px;cursor:pointer;margin-left:4px}
input.n{width:90px;font-size:20px;padding:8px;border:2px solid #c5d3e6;border-radius:10px;margin:0 8px 0 4px}
.iv{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}@media(max-width:760px){.iv{grid-template-columns:1fr}}
svg{width:100%;height:auto;background:#fff;border:1px solid #c5d3e6;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #c5d3e6;padding:4px;text-align:center}
details{background:#f5f8fd;border-radius:10px;padding:6px 10px;margin:6px 0}
.step{animation:f .3s}@keyframes f{from{opacity:0}to{opacity:1}}
.sel{border-color:#f57c00;background:#fff3e0}.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:760px){.vit{grid-template-columns:1fr}}.vt{border:3px dashed #90a4c0;border-radius:12px;padding:8px;min-height:90px;cursor:pointer;background:#f5f8fd}textarea{width:100%;font:16px system-ui,Arial,sans-serif;border:2px solid #c5d3e6;border-radius:10px;padding:8px}
</style></head><body>
<header><span class="badge">CNEB 3.° SECUNDARIA • RESUELVE PROBLEMAS DE REGULARIDAD, EQUIVALENCIA Y CAMBIO</span>
<h1>La feria de los sistemas</h1><p>Plantea y resuelve sistemas de ecuaciones 2×2 con situaciones del Valle del Mantaro</p></header>
<nav id="nv"></nav><div class="stats" id="st"></div>
<main>
<section id="t0"></section><section id="t1" hidden></section><section id="t2" hidden></section><section id="t3" hidden></section><section id="t4" hidden></section><section id="t5" hidden></section><section id="t6" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id),S={first:0,hint:0,extra:0};
const bx=(t,m)=>`<div class="b ${t}"><b>${{ok:'✅ ',err:'❌ ',hint:'💡 ',info:'ℹ️ '}[t]}</b>${m}</div>`;
const Q=()=>({e:0,h:0,d:false});
function stats(){$('st').innerHTML=`<span>🥇 Acierto al primer intento: <b>${S.first}</b></span><span>💡 Con uso de pista: <b>${S.hint}</b></span><span>🔁 Intentos adicionales: <b>${S.extra}</b></span>`}
function good(q){if(q.d)return;q.d=true;if(q.h)S.hint++;else if(!q.e)S.first++;stats()}
function bad(q){q.e++;S.extra++;stats()}
const TN=[[0,'Reto & Ejemplo'],[1,'Nivel 1: Plantear el sistema'],[2,'Nivel 2: Elegir método y resolver'],[4,'Clasificar métodos'],[3,'Modo Investigar'],[5,'Comparar y Explicar'],[6,'Reto Final']];
$('nv').innerHTML=TN.map(([i,t])=>`<button onclick="go(${i})" data-i="${i}">${t}</button>`).join('');
function go(n){for(let i=0;i<7;i++)$('t'+i).hidden=i!=n;[...$('nv').children].forEach(b=>b.className=b.dataset.i==n?'on':'');scrollTo(0,0)}

/* ---------- Pestaña 1 ---------- */
const EJ=['<b>Incógnitas:</b> p = precio del kg de papa (S/); q = precio del kg de queso fresco (S/).','<b>Sistema:</b> 2p + q = 18 y p + q = 15.','<b>Método elegido: reducción.</b> Restamos las ecuaciones: (2p + q) − (p + q) = 18 − 15.','Al restar, 2p − p = p y q − q = 0; por tanto <b>p = 3</b>.','Reemplazamos en p + q = 15: 3 + q = 15, luego <b>q = 12</b>.','<b>Verificación:</b> 2(3) + 12 = 18 ✔ y 3 + 12 = 15 ✔.','<b>Interpretación:</b> la papa cuesta S/ 3 el kg y el queso fresco S/ 12 el kg.'];
let ej=1;
function r0(){$('t0').innerHTML=`<div class="card"><h2>🎪 Desafío del organizador de la feria</h2>
<p>En la Feria Dominical de Huancayo y en el transporte desde Chupaca debes <b>plantear, resolver, interpretar y justificar</b> sistemas de ecuaciones.</p>
${bx('info','<b>Paso 1:</b> Plantea las ecuaciones.<br><b>Paso 2:</b> Elige el método y resuelve.<br><b>Paso 3:</b> Verifica e interpreta en el contexto.')}</div>
<div class="card"><h3>📘 Ejemplo guiado</h3><p>“2 kg de papa y 1 kg de queso fresco cuestan S/ 18; 1 kg de papa y 1 kg de queso fresco cuestan S/ 15.”</p>
${EJ.slice(0,ej).map((e,i)=>`<div class="b ${i==EJ.length-1?'ok':'info'} step">${i+1}. ${e}</div>`).join('')}
<button class="btn" onclick="ej++;r0()" ${ej>=EJ.length?'disabled':''}>Ver siguiente paso</button><br>
<button class="btn or" onclick="go(1)">Iniciar Nivel 1</button></div>`}

/* ---------- Nivel 1 ---------- */
const L1=[
{t:'En la Feria Dominical: 3 kg de habas y 2 kg de choclo cuestan S/ 21; 1 kg de habas y 2 kg de choclo cuestan S/ 11.',
o:[['3h + 2c = 21','h + 2c = 11',1,''],['2h + 3c = 21','2h + c = 11',0,'Intercambiaste los coeficientes: los 3 kg son de habas (h) y los 2 kg de choclo (c), no al revés.'],['3h + 2c = 21','3h + 2c = 11',0,'Repetiste la primera compra con otro total. En la segunda compra solo hay 1 kg de habas.'],['3h + 2c = 21','h + c = 11',0,'Ecuación incompleta: en la segunda compra también hay 2 kg de choclo, no 1 kg.']],
hs:['Identifica las dos cantidades desconocidas: el precio de 1 kg de cada producto.','Cada ecuación es una compra: (kg de habas)·h + (kg de choclo)·c = total pagado.'],
v:'h = precio del kg de habas (S/); c = precio del kg de choclo (S/).',
ex:'Restando las ecuaciones: 2h = 10, luego h = 5; en h + 2c = 11: 5 + 2c = 11, c = 3. Habas: S/ 5 el kg; choclo: S/ 3 el kg.'},
{t:'En un puesto de truchas hay 12 clientes entre adultos y niños. Cada adulto paga S/ 10 y cada niño S/ 6; en total se recaudó S/ 88.',
o:[['a + n = 12','10a + 6n = 88',1,''],['a + n = 12','6a + 10n = 88',0,'Intercambiaste los precios: el adulto paga S/ 10 (10a) y el niño S/ 6 (6n).'],['a + n = 88','10a + 6n = 12',0,'Intercambiaste los totales: 12 es el número de clientes y 88 el dinero recaudado.'],['a + n = 12','10a = 88',0,'Ecuación incompleta: en la recaudación también pagan los niños (6n).']],
hs:['Hay dos ecuaciones: una cuenta personas y otra cuenta dinero.','Dinero = (precio adulto)·a + (precio niño)·n.'],
v:'a = número de adultos; n = número de niños.',
ex:'De a + n = 12 se tiene n = 12 − a. En 10a + 6(12 − a) = 88: 4a + 72 = 88, a = 4 y n = 8. Fueron 4 adultos y 8 niños.'},
{t:'Don Julio vende 25 sacos entre papa amarilla y papa huayro; vendió 7 sacos más de amarilla que de huayro.',
o:[['x + y = 25','x − y = 7',1,''],['x + y = 25','x + y = 7',0,'Usaste suma en lugar de diferencia: “7 sacos más de amarilla” se expresa con x − y = 7.'],['x + y = 25','y − x = 7',0,'Invertiste la diferencia: la mayor cantidad es la amarilla (x), así que se resta x − y.'],['x + y = 25','x = 7',0,'Ecuación incompleta: 7 es la diferencia entre x e y, no el valor de x.']],
hs:['“7 sacos más” indica una diferencia entre las dos cantidades.','Asigna x a la papa amarilla (la mayor) y y a la huayro.'],
v:'x = sacos de papa amarilla; y = sacos de papa huayro.',
ex:'Sumando las ecuaciones: 2x = 32, x = 16; luego y = 25 − 16 = 9. Vendió 16 sacos de amarilla y 9 de huayro.'}];
const P1=[[2,0,3,1],[1,3,0,2],[3,1,2,0]];
let c1=0;const T1=L1.map(()=>({q:Q(),fb:'',hi:0,pr:false,d:false}));
function r1(){const s=L1[c1],t=T1[c1];
$('t1').innerHTML=`<div class="card"><h3>Situación ${c1+1} de 3</h3>${bx('info','Lee la situación y elige el sistema que la modela.')}<p><b>${s.t}</b></p>
${P1[c1].map(k=>`<button class="opt" ${t.d?'disabled':''} onclick="pick(${k})">${s.o[k][0]}<br>${s.o[k][1]}</button>`).join('')}
${t.hi?bx('hint',s.hs.slice(0,t.hi).join('<br>')):''}${t.fb}${t.pr?bx('info','<b>Procedimiento correcto:</b> '+s.ex):''}
<button class="btn gr" onclick="t=T1[c1];t.hi=Math.min(t.hi+1,2);t.q.h=1;r1()" ${t.d?'disabled':''}>💡 Pedir pista</button>
${t.d?(c1<2?'<button class="btn" onclick="c1++;r1()">Siguiente situación ▶</button>':'<button class="btn or" onclick="go(2)">Avanzar al Nivel 2</button>'):''}</div>`}
function pick(k){const s=L1[c1],t=T1[c1],o=s.o[k];if(t.d)return;
if(o[2]){good(t.q);t.d=true;t.fb=bx('ok',`¡Correcto! Cada ecuación une cantidades con su total, sin mezclar los datos de cada compra.<br><b>Incógnitas:</b> ${s.v}`)+bx('info','<b>Solución:</b> '+s.ex)}
else{bad(t.q);if(t.q.e>=2){t.d=true;const c=s.o.find(z=>z[2]);t.fb=bx('err',o[3]+' Agotaste tus 2 intentos.')+bx('ok',`<b>Respuesta correcta:</b> ${c[0]} ; ${c[1]}<br><b>Incógnitas:</b> ${s.v}`)+bx('info','<b>Explicación:</b> '+s.ex)}else t.fb=bx('err',o[3]+' Te queda 1 intento.<br><button class="btn gr" onclick="T1[c1].pr=true;r1()">Ver el procedimiento correcto</button>')}r1()}

/* ---------- Nivel 2 ---------- */
const L2=[
{e:['y = 2x','x + y = 9'],rec:'s',why:'la primera ecuación ya tiene y despejada: solo hay que reemplazarla en la otra.',steps:['Reemplazar y = 2x en x + y = 9: x + 2x = 9','Reducir términos: 3x = 9','Despejar: x = 3','Calcular y = 2(3) = 6','Verificar en ambas ecuaciones'],P:[2,0,4,1,3],x:3,y:6,q:[(x,y)=>[y,2*x],(x,y)=>[x+y,9]]},
{e:['y = 3x − 2','y = x + 4'],rec:'i',why:'las dos ecuaciones tienen y despejada: se pueden igualar directamente.',steps:['Igualar las expresiones de y: 3x − 2 = x + 4','Agrupar términos con x: 2x = 6','Despejar: x = 3','Calcular y = 3 + 4 = 7','Verificar en ambas ecuaciones'],P:[3,1,4,0,2],x:3,y:7,q:[(x,y)=>[y,3*x-2],(x,y)=>[y,x+4]]},
{e:['x + y = 10','x − y = 2'],rec:'r',why:'los coeficientes de y son opuestos (+1 y −1): al sumar se elimina y.',steps:['Sumar las ecuaciones: (x + y) + (x − y) = 10 + 2','Reducir: 2x = 12','Despejar: x = 6','Reemplazar en x + y = 10: 6 + y = 10, y = 4','Verificar en ambas ecuaciones'],P:[1,3,0,4,2],x:6,y:4,q:[(x,y)=>[x+y,10],(x,y)=>[x-y,2]]},
{e:['2x + 3y = 12','3x − y = 7'],rec:'r',why:'al multiplicar la 2.ª ecuación por 3 aparecen −3y y +3y, que se eliminan al sumar (también podrías despejar y = 3x − 7 y sustituir).',steps:['Multiplicar la 2.ª ecuación por 3: 9x − 3y = 21','Sumar con la 1.ª: 11x = 33','Despejar: x = 3','Reemplazar en 3x − y = 7: 9 − y = 7, y = 2','Verificar en ambas ecuaciones'],P:[2,4,1,0,3],x:3,y:2,q:[(x,y)=>[2*x+3*y,12],(x,y)=>[3*x-y,7]]}];
const MN={s:'Sustitución',i:'Igualación',r:'Reducción'};
const H2=[['Mira si alguna incógnita ya está despejada en una ecuación.','Si una incógnita tiene coeficientes iguales u opuestos, piensa en eliminarla sumando o restando.'],['Primero se consigue una ecuación con una sola incógnita; la otra incógnita se calcula después.','La verificación siempre cierra el procedimiento.'],['Despeja primero la incógnita que queda sola y luego reemplaza.','Comprueba tus valores en AMBAS ecuaciones antes de responder.']];
const HS=[['Como y = 2x, reemplaza y en la otra ecuación.','Queda x + 2x = 9, es decir 3x = 9.','Despeja x y luego calcula y = 2x.'],['Iguala las dos expresiones de y.','Queda 3x − 2 = x + 4, es decir 2x = 6.','Con el valor de x, calcula y = x + 4.'],['Los coeficientes de y son +1 y −1: suma las ecuaciones.','Al sumar queda 2x = 12.','Con el valor de x, usa x + y = 10 para hallar y.'],['Multiplica la 2.ª ecuación por 3 para poder eliminar y.','Al sumar con la 1.ª queda 11x = 33.','Con el valor de x, reemplaza en 3x − y = 7.']];
let c2=0;const T2=L2.map(s=>({st:0,m:null,o:[...s.P],q:[Q(),Q(),Q()],hi:[0,0,0],fb:['','',''],vx:'',vy:'',pr:false}));
const ev=(s,x,y)=>s.q.map((f,i)=>{const[l,r]=f(x,y);return `Ecuación ${i+1} (${s.e[i]}): izquierda = ${l}, derecha = ${r} ${l==r?'✔ cumple':'✘ no cumple'}`}).join('<br>');
const hb=(t,k)=>(t.hi[k]?bx('hint',(k==2?HS[c2]:H2[k]).slice(0,t.hi[k]).join('<br>')):'')+t.fb[k]+(k==1&&t.pr?bx('info','<b>Orden correcto:</b><br>'+L2[c2].steps.map((x,i)=>(i+1)+'. '+x).join('<br>')):'');
function r2(){const s=L2[c2],t=T2[c2];let h=`<div class="card"><h3>Sistema ${c2+1} de 4</h3><div class="sys">${s.e.map((q,i)=>`<div>(${i+1}) ${q}</div>`).join('')}</div>
<h4>a) Elige el método</h4>${['s','i','r'].map(k=>`<button class="btn ${t.m==k?'on':'gr'}" ${t.st>0?'disabled':''} onclick="T2[c2].m='${k}';r2()">${MN[k]}</button>`).join('')}${hb(t,0)}`;
if(t.st>=1)h+=`<h4>b) Ordena los pasos (${MN[s.rec]})</h4>${t.o.map((k,j)=>`<div class="row"><span>${j+1}. ${s.steps[k]}</span><span><button class="mini" aria-label="subir" ${t.st>1?'disabled':''} onclick="mv(${j},-1)">▲</button><button class="mini" aria-label="bajar" ${t.st>1?'disabled':''} onclick="mv(${j},1)">▼</button></span></div>`).join('')}${hb(t,1)}`;
if(t.st>=2)h+=`<h4>c) Escribe la solución</h4><label>x = <input class="n" inputmode="numeric" value="${t.vx}" ${t.st>2?'disabled':''} oninput="T2[c2].vx=this.value"></label><label>y = <input class="n" inputmode="numeric" value="${t.vy}" ${t.st>2?'disabled':''} oninput="T2[c2].vy=this.value"></label>${hb(t,2)}`;
h+=`<div><button class="btn gr" onclick="c2--;r2()" ${c2==0?'disabled':''}>◀ Anterior</button><button class="btn" onclick="chk()" ${t.st>2?'disabled':''}>Comprobar</button><button class="btn gr" onclick="c2++;r2()" ${c2==3?'disabled':''}>Siguiente ▶</button><button class="btn gr" onclick="T2[c2].hi[T2[c2].st]=Math.min(T2[c2].st==2?3:2,T2[c2].hi[T2[c2].st]+1);T2[c2].q[T2[c2].st].h=1;r2()" ${t.st>2?'disabled':''}>💡 Pedir pista</button></div></div>`;
if(T2.every(x=>x.st>2)){const n=['elegir el método','ordenar los pasos del procedimiento','calcular y verificar x e y'],w=[0,1,2].filter(k=>T2.some(x=>x.q[k].e||x.q[k].h));
h+=`<div class="card"><h3>📊 Resumen de desempeño</h3><p>🥇 Primer intento: <b>${S.first}</b> · 💡 Con pista: <b>${S.hint}</b> · 🔁 Intentos adicionales: <b>${S.extra}</b></p>${w.length?bx('hint','Conviene repasar: '+w.map(k=>n[k]).join(', ')+'.'):bx('ok','¡Excelente dominio! Pasa al Modo Investigar para interpretar las gráficas.')}<button class="btn or" onclick="go(3)">Ir al Modo Investigar</button></div>`}
$('t2').innerHTML=h}
function mv(j,d){const o=T2[c2].o,k=j+d;if(k<0||k>4)return;[o[j],o[k]]=[o[k],o[j]];r2()}
function chk(){const s=L2[c2],t=T2[c2],k=t.st,q=t.q[k];
if(k==0){if(!t.m){t.fb[0]=bx('err','Elige un método antes de comprobar.');return r2()}good(q);t.st=1;
t.fb[0]=bx('ok',t.m==s.rec?`¡Muy bien! ${MN[t.m]} es el más conveniente porque ${s.why}`:`${MN[t.m]} también es un método válido, pero el más conveniente es ${MN[s.rec]} porque ${s.why} Ordenaremos los pasos con ese método.`)}
else if(k==1){const i=t.o.findIndex((v,j)=>v!=j);
if(i<0){good(q);t.st=2;t.fb[1]=bx('ok','¡Orden correcto! Primero se obtiene una ecuación con una incógnita, se resuelve, se calcula la otra y al final se verifica.')}
else{bad(q);t.fb[1]=bx('err',`El paso «${s.steps[t.o[i]]}» no puede ir en la posición ${i+1}: depende de cálculos que aún no se hicieron o ya no corresponde ahí. Reordena e inténtalo otra vez.<br><button class="btn gr" onclick="T2[c2].pr=true;r2()">Ver el orden correcto</button>`)}}
else{if(t.vx===''||t.vy==='')return(t.fb[2]=bx('err','Escribe los valores de x e y.'),r2());const x=Number(t.vx),y=Number(t.vy);
if(x==s.x&&y==s.y){good(q);t.st=3;t.fb[2]=bx('ok',`¡Correcto! (x, y) = (${x}, ${y}) hace verdaderas las dos ecuaciones a la vez:<br>${ev(s,x,y)}`)}
else{bad(q);const ok=s.q.map(f=>{const[l,r]=f(x,y);return l==r}),m=(x==s.x&&y!=s.y)?`x está bien (x = ${x}). Reemplaza x en una de las ecuaciones y despeja y con cuidado.`:(y==s.y&&x!=s.x)?`y está bien (y = ${y}). Reemplaza y en una de las ecuaciones y despeja x.`:((x==-s.x&&x!=0)||(y==-s.y&&y!=0))?'Uno de tus valores es el opuesto del correcto: revisa los signos al restar o despejar.':(x==s.y&&y==s.x)?'Parece que intercambiaste los valores de x e y.':(ok[0]!=ok[1])?`Tu par cumple solo la ecuación ${ok[0]?1:2}; no cumple la ecuación ${ok[0]?2:1} (${s.e[ok[0]?1:0]}).`:'Ese par no cumple ninguna de las ecuaciones. Pide una pista.';
t.fb[2]=bx('err',`${m}<br>${ev(s,x,y)}<br><button class="btn gr" onclick="T2[c2].vx='';T2[c2].vy='';T2[c2].fb[2]='';r2()">🔄 Reintentar</button>`)}}
r2()}

/* ---------- Modo Investigar ---------- */
const NX={one:'Las rectas se cortan en un solo punto: ese par (x, y) cumple ambas ecuaciones.',none:'Las rectas son paralelas (misma pendiente y distinto corte con el eje y): nunca se cruzan, no hay solución.',inf:'Las dos ecuaciones representan la misma recta (la segunda es el doble de la primera): todos sus puntos son soluciones.'};
const IV=[{c:'(i)',e:['y = x + 1','y = −x + 5'],m:[[1,1],[-1,5]],s:[2,3],n:'one',w:[-1,8,-1,9]},
{c:'(ii)',e:['y = 2x − 1','y = x + 2'],m:[[2,-1],[1,2]],s:[3,5],n:'one',w:[-1,8,-2,10]},
{c:'(iii)',e:['y = 2x + 1','y = 2x − 3'],m:[[2,1],[2,-3]],s:null,n:'none',w:[-1,6,-4,12]},
{c:'(iv)',e:['x + y = 4','2x + 2y = 8'],m:[[-1,4],[-1,4]],s:null,n:'inf',w:[-1,6,-2,6]},
